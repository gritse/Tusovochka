# Database settings
db.host=localhost
db.name=smithereen
db.user=root
db.password=mysql
# You can limit the number of concurrent database connections, default is 100
#db.max_connections=50

# The domain for your instance. Used for absolute URLs (links in emails, etc). If running on localhost, must include the port.
#domain=localhost:4567
domain=YOUR_DOMAIN_HERE

# Uncomment this to make the server members-only: profiles, posts, groups, photos and the API are only
# available to logged-in users. The login, sign-up and password reset pages, the "about" page and the
# privacy policy stay public. Note that uploaded files are served by your web server and imgproxy directly,
# so anyone who has a link to a file can still open it.
#private_server=true

# The MCP endpoint at /mcp lets AI agents (Claude Code, the Claude Agent SDK) act on behalf of a user with an
# access token the user creates in Settings > Applications. Set this to false to turn the endpoint off; the
# tokens then only work with the regular API.
#mcp.enabled=true

# Uncomment this to use http:// URIs for local objects instead of https://.
# Intended for development purposes only.
#use_http_scheme.i_know_what_i_am_doing=true

# Filesystem path where user-uploaded files (profile pictures, post media) are stored.
# Must be under your web server's web root.
upload.path=/var/www/smithereen/s/uploads
# The URL path that corresponds to the above filesystem path.
upload.url_path=/s/uploads
# Or, if you want to use S3 object storage, see readme for details
#upload.backend=s3
#upload.s3. ...

# The URL path prefix configured in imgproxy and nginx
imgproxy.url_prefix=/i
# Paths to media directories relative to IMGPROXY_LOCAL_FILESYSTEM_ROOT
imgproxy.local_uploads=/uploads
# These must match your imgproxy configuration. They're used to sign URLs to prevent a DoS attack on your server.
# To generate: run `echo $(xxd -g 2 -l 32 -p /dev/random | tr -d '\n')` (twice).
imgproxy.key=GENERATE YOUR OWN
imgproxy.salt=GENERATE YOUR OWN

# Uploads. Sizes take a K, M or G suffix.
# Images (photos, GIFs, avatars) above this size are refused.
#upload.max_image_size=10M
# Videos are transcoded in the background with ffmpeg, which must be installed (the Docker image has it).
# Set these if ffmpeg and ffprobe are not on the PATH.
#media.ffmpeg_path=/usr/bin/ffmpeg
#media.ffprobe_path=/usr/bin/ffprobe
# Videos above this size or longer than this many seconds are refused. The web server in front must allow
# request bodies at least this large (client_max_body_size in nginx).
#media.video.max_size=300M
#media.video.max_duration=1800
# Audio files above this size or longer than this many seconds are refused. They are transcoded to AAC in M4A.
#media.audio.max_size=100M
#media.audio.max_duration=7200
# Videos are scaled down so that the shorter side is at most this many pixels; 720 means 720p.
#media.video.max_height=720
# CPU usage: threads one ffmpeg run may use, and how many videos are transcoded at once. 1 and 1 keep
# transcoding to a single core.
#media.ffmpeg_threads=1
#media.processing_threads=1
# A transcode that takes longer than this many seconds is given up on.
#media.video.transcode_timeout=1800
