name: Build and publish Docker image

# Runs on every push to master, except pushes that only touch files the image
# doesn't contain (the Claude Code channel, docs, top-level Markdown), and can
# also be started by hand. A push builds the pushed commit; a manual run always
# builds the latest commit on master, whatever branch it was started from. The
# result is published to the GitHub Container Registry of this repository.
on:
    push:
        branches:
            - master
        paths-ignore:
            - channel/**
            - docs/**
            - '*.md'
    workflow_dispatch:

permissions:
    contents: read
    packages: write

# Pushes in quick succession build one at a time, oldest first, so "latest" always ends up on the newest commit.
# A run that is still waiting is replaced by a newer one instead of building a commit that is already outdated.
concurrency:
    group: publish-image
    cancel-in-progress: false

jobs:
    build_and_push:
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event_name == 'push' && github.sha || 'master' }}
                  fetch-depth: 0 # the build derives its version from git tags

            - name: Log in to the GitHub Container Registry
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Compute image tags
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest
                      type=sha,format=long
                      type=raw,value={{date 'YYYY.MM.DD.HHmmss' tz='Europe/Warsaw'}}

            - name: Build and push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
