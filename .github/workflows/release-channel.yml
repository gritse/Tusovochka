name: Release the Claude Code channel

# Runs on every push to master that touches channel/. When the version in channel/package.json has no release yet, it
# packs channel/ with npm pack and publishes the tarball as a GitHub release with the tag channel-v<version>, created
# by this workflow, so the bridge can be run with npx straight from the release URL (see channel/README.md). Pushes
# that do not bump the version do nothing. Server builds ignore these tags (.mvn/maven-git-versioning-extension.xml).
on:
    push:
        branches:
            - master
        paths:
            - channel/**
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-channel

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Check whether this version is released
              id: version
              working-directory: channel
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  version=$(node -p 'require("./package.json").version')
                  tag="channel-v$version"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  if gh release view "$tag" > /dev/null 2>&1; then
                      echo "$tag is already released, nothing to do; bump the version in channel/package.json for a new release"
                      echo "released=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "released=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Pack
              if: steps.version.outputs.released == 'false'
              working-directory: channel
              run: npm pack

            - name: Create the release
              if: steps.version.outputs.released == 'false'
              working-directory: channel
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.version }}
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  file="tusovochka-channel-$VERSION.tgz"
                  url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$file"
                  gh release create "$TAG" "$file" --target "$GITHUB_SHA" \
                      --title "Claude Code channel $VERSION" --latest=false \
                      --notes "Run with \`npx -y $url\`. Setup: [channel/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/channel/README.md)."
